# Dev SQL Server for EN–UR Grammar. SA password is for local use only — override in production.
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: enur-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_Password123"
    ports:
      - "14333:1433"
    volumes:
      - enur-sql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  enur-sql-data:
